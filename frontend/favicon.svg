<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Same badge as .brand-mark in style.css (the accent-to-accent2
       gradient, white flask icon) but with the colors written out
       literally: a favicon renders in the browser's own tab chrome, with
       no access to the page's CSS custom properties or currentColor. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#db2777" />
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5.5" fill="url(#g)" />
  <svg x="5.2" y="5.2" width="13.6" height="13.6" viewBox="0 0 24 24">
    <path d="M9 2v6L4 20a1 1 0 0 0 1 2h14a1 1 0 0 0 1-2L15 8V2" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M9 2h6" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M7.5 15h9" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</svg>
