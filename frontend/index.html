<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Research Lab Finder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Research Lab Finder</h1>
    <p>Search professors by research field, topic, or institution.</p>
  </header>

  <main>
    <form id="search-form">
      <div class="field">
        <label for="field">Field</label>
        <select id="field" name="field">
          <option value="">Any field</option>
        </select>
      </div>
      <div class="field">
        <label for="topic">Research topic</label>
        <input type="text" id="topic" name="topic" list="topic-options" placeholder="e.g. optogenetics" autocomplete="off" />
        <datalist id="topic-options"></datalist>
      </div>
      <div class="field">
        <label for="institution">Institution</label>
        <input type="text" id="institution" name="institution" list="institution-options" placeholder="e.g. Stanford" autocomplete="off" />
        <datalist id="institution-options"></datalist>
      </div>

      <details id="advanced-search">
        <summary>Advanced search</summary>
        <div class="advanced-fields">
          <div class="field">
            <label for="name">Professor name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Smith" />
          </div>
          <div class="field">
            <label for="text">Search publications</label>
            <input type="text" id="text" name="text" placeholder="e.g. a specific technique or method" />
            <p class="hint">Searches actual paper titles and abstracts, not just topic categories.</p>
          </div>
          <div class="field">
            <label for="city">City</label>
            <input type="text" id="city" name="city" />
          </div>
          <div class="field">
            <label for="state">State</label>
            <input type="text" id="state" name="state" />
          </div>
          <div class="field">
            <label for="country">Country</label>
            <input type="text" id="country" name="country" />
          </div>
        </div>
      </details>

      <button type="submit">Search</button>
    </form>

    <p id="status" aria-live="polite"></p>

    <ul id="results"></ul>

    <div id="pagination">
      <button id="prev-page" type="button" disabled>Previous</button>
      <span id="page-label"></span>
      <button id="next-page" type="button" disabled>Next</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
