# Render Blueprint (https://render.com/docs/blueprint-spec).
#
# Defines the one web service Phase 6.2 calls for -- see docs/ROADMAP.md.
# Postgres is NOT defined here: per the 2026-08-08 decision, the database is
# Neon (its free tier persists indefinitely; Render's free Postgres expires
# and gets deleted after 30 days, which is not acceptable for data that cost
# real OpenAlex/ORCID API time to collect). Create the Neon project
# separately and paste its connection string into DATABASE_URL below.
#
# To deploy: push this repo to GitHub, then in the Render dashboard use
# "New +" -> "Blueprint" and point it at the repo. Render reads this file
# and prompts for every envVar marked sync: false.
services:
  - name: research-lab-finder
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    # No preDeployCommand -- that's a paid-plan-only feature, and this
    # service is on the free plan. Migrations instead run at container
    # start, baked into the Dockerfile's CMD (see Dockerfile's comment):
    # `python -m database.migrate && uvicorn ...`. Idempotent, so re-running
    # it on every boot (including free-tier cold starts after sleep) is
    # safe.
    envVars:
      - key: ENV
        value: production
      # backend/auth.py: prefixes verification/reset email links so they're
      # absolute (clickable from an actual mail client) rather than a bare
      # "/#/..." path, which only resolves when clicked from within the
      # running app. Not a secret, so a plain value rather than sync: false
      # -- update this if the canonical domain ever changes.
      - key: APP_BASE_URL
        value: https://research-finder.com
      # Neon connection string, e.g.
      # postgresql://user:password@ep-xxx.neon.tech/research_lab_finder?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Generate a fresh one for production -- don't reuse the local .env
      # value. E.g.: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Where "Flag an issue" submissions (backend/flags.py) get emailed --
      # see POST /api/professors/{id}/flag in backend/main.py. Optional: if
      # unset, flags still save to the database, the notification email is
      # just silently skipped.
      - key: ADMIN_EMAIL
        sync: false
      # ORCID creds are only needed by the local ingestion pipeline (Phase
      # 6.3 keeps that running on your machine against DATABASE_URL, not on
      # Render), so they're intentionally not listed here.
      #
      # Resend (chosen 2026-08-08 -- see backend/email.py and
      # docs/ROADMAP.md Phase 6.2): permanent 3,000 emails/month free tier,
      # plain REST API.
      - key: EMAIL_BACKEND
        value: resend
      - key: RESEND_API_KEY
        sync: false
      # Optional -- backend/email.py defaults to Resend's own shared
      # sending domain if unset, which works with zero setup but is meant
      # for testing. Verify research-finder.com in the Resend dashboard
      # (adds SPF/DKIM DNS records, same idea as the Render custom-domain
      # setup) and set this to an address on it before relying on this for
      # real users, e.g.:
      #   Research Finder <noreply@research-finder.com>
      - key: EMAIL_FROM
        sync: false
